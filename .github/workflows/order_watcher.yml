name: 실시간 주문 알림 (Cafe24)

on:
  workflow_dispatch:  # cron-job.org가 2분마다 외부에서 트리거

permissions:
  contents: read
  actions: write  # ORDER_STATE GitHub Variable 갱신용

jobs:
  # 멈춘 run 청소. check-orders만 줄(concurrency)을 서고 이 작업은 줄 밖에서 돈다.
  # GitHub 쪽 오류로 run 하나가 대기 상태로 멈추면 그 뒤 run이 전부 막혀 알림이
  # 끊기는데(9/13 13:24~16:10 사례), 다음 트리거 때 이 작업이 멈춘 run을 치운다.
  unstick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 6분 넘게 멈춘 run 취소
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          THRESHOLD=360   # 정상 run은 timeout 4분 안에 끝나므로 6분 초과 = 멈춤
          now=$(date -u +%s)
          for st in queued in_progress waiting pending requested; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow order_watcher.yml               --status "$st" --limit 50 --json databaseId,createdAt               --jq '.[] | "\(.databaseId) \(.createdAt)"'
          done | sort -u | while read -r id created; do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            age=$(( now - $(date -u -d "$created" +%s) ))
            [ "$age" -lt "$THRESHOLD" ] && continue
            [ "$age" -gt 86400 ] && continue   # 취소 불가한 오래된 유령 run 반복 시도 방지
            echo "멈춘 run $id (${age}초 경과) 취소"
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY"               || gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/force-cancel"               || true
          done
          echo "청소 완료"

  check-orders:
    runs-on: ubuntu-latest
    # 동시 실행 방지(토큰 회전 경쟁 방지) — 워크플로 전체가 아니라 이 작업에만 건다.
    concurrency:
      group: order-watcher-hexaq
      cancel-in-progress: false
    timeout-minutes: 4

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 주문 확인 및 Discord 알림 발송
        env:
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          CAFE24_REDIRECT_URI: ${{ secrets.CAFE24_REDIRECT_URI }}
          CAFE24_REFRESH_TOKEN: ${{ vars.CAFE24_REFRESH_TOKEN }}
          CAFE24_ACCESS_TOKEN: ${{ vars.CAFE24_ACCESS_TOKEN }}
          CAFE24_ACCESS_TOKEN_EXPIRES_AT: ${{ vars.CAFE24_ACCESS_TOKEN_EXPIRES_AT }}
          CAFE24_TARGET_KEYWORD: ${{ secrets.CAFE24_TARGET_KEYWORD }}
          DISCORD_WEBHOOK_URL_ORDERS: ${{ secrets.DISCORD_WEBHOOK_URL_ORDERS }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          META_ACCESS_TOKEN: unused
          META_AD_ACCOUNT_ID: unused
        run: python cloud_order_watcher.py
